name: stockvirtue
description: "StockVirtue — Indian stock market simulator with virtual money."
publish_to: 'none'
version: 1.4.1+9

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # HTTP + interceptors
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Secure token storage (Android/iOS/macOS/Linux/Windows; web falls back to localStorage)
  flutter_secure_storage: ^10.3.1

  # Socket.IO client for live tick stream
  socket_io_client: ^3.0.0

  # TradingView chart embedding on native platforms
  webview_flutter: ^4.10.0
  # package:web is provided transitively by Flutter SDK; pinned here for the
  # iframe widget on web.
  web: ^1.1.0

  # Trade-history export sharing (native share sheet / Web Share API)
  share_plus: ^13.1.0

  # Open external links (Play Store "Rate us", etc.)
  url_launcher: ^6.3.1

  # Real SMS OTP + Google sign-in via Firebase. Init is gated so the app
  # still runs in dev-OTP mode without firebase_options.dart present.
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  google_sign_in: ^7.2.0
  firebase_analytics: ^12.4.3

  # Push: FCM for background delivery + local notifications to display them
  # (foreground FCM messages and realtime socket events).
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # In-app logo (derived from assets/newLogo.png by tool/brand_assets.py).
    # The 1.4 MB source art and the launcher-icon inputs in assets/icon/ are
    # build-time only and deliberately NOT bundled.
    - assets/brand/
    # Offline company-name directory (NSE mainboard + SME). Regenerate with
    # `npx ts-node scripts/gen-company-directory.ts` from backend/.
    - assets/data/
    - assets/fonts/OFL.txt

  # Inter (SIL OFL 1.1) — bundled static weights so prices render with
  # tabular figures from the very first frame, offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# Launcher icons from the SV brand logo (assets/newLogo.png). To regenerate
# after changing the logo:
#   python tool/brand_assets.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  # Full-bleed icon: iOS, legacy (pre-Android-8) launchers and the web.
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  # Android 8+ adaptive icon: dark-teal gradient + the SV mark scaled inside
  # the 66dp safe circle, so circular / squircle masks never clip the arrow.
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#070A0F"
    theme_color: "#070A0F"
